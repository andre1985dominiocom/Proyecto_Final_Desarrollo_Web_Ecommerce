<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mi Cuenta</title>

    <!-- Estilos globales -->
    <link rel="stylesheet" href="../../CSS/main.css">

    <!-- Estilos de la página -->
    <link rel="stylesheet" href="../../CSS/pages/account.css">
</head>

<body>

    <main class="account">

        <!-- Sidebar -->
        <aside class="account__sidebar">

            <!-- Avatar -->
            <div class="account__avatar">
                <span class="account__avatar-initials">JD</span>
            </div>

            <!-- Usuario -->
            <p class="account__username">
                Juan David
            </p>

            <!-- Navegación -->
            <nav class="account__nav">

                <ul class="account__nav-list">

                    <li class="account__nav-item account__nav-item--active">
                        <a class="account__nav-link" href="/index.html">
                            Inicio
                        </a>
                    </li>

                    <li class="account__nav-item">
                        <a class="account__nav-link" href="wishlist.html">
                            Lista de Deseos
                        </a>
                    </li>

                    <li class="account__nav-item">
                        <a class="account__nav-link account__nav-link--logout"
                            href="../auth/login.html">
                            Cerrar Sesión
                        </a>
                    </li>

                </ul>

            </nav>

        </aside>

        <!-- Contenido -->
        <section class="account__content">

            <h2 class="account__content-title">
                Mi Cuenta
            </h2>

            <!-- Información -->
            <fieldset class="account__fieldset">

                <legend class="account__legend">
                    Información Personal
                </legend>

                <p>
                    <strong>Nombre de Usuario:</strong>
                    <span id="display__username"></span>
                </p>

                <p>
                    <strong>Correo Electrónico:</strong>
                    <span id="display__email"></span>
                </p>

                <p>
                    <strong>Miembro desde:</strong>
                </p>

            </fieldset>

            <!-- Configuración -->
            <fieldset class="account__fieldset">

                <legend class="account__legend">
                    Configuración de Privacidad
                </legend>

                <label>
                    <input type="checkbox" checked>
                    Recibir notificaciones por correo electrónico
                </label>

            </fieldset>

        </section>

    </main>

</body>
</html>
