<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Categorías - DidiStore Admin</title>
    <link rel="stylesheet" href="../../css/main.css">
</head>
<body>
    <div class="admin-layout" data-admin-entity="categories">
        <!-- Sidebar -->
        <aside class="admin-sidebar">
            <div class="admin-sidebar__logo">DidiStore</div>
            <nav class="admin-sidebar__nav">
                <a href="dashboard.html" class="admin-sidebar__link">🏠 Dashboard</a>
                <a href="products.html" class="admin-sidebar__link">📦 Productos</a>
                <a href="categories.html" class="admin-sidebar__link admin-sidebar__link--active">🏷️ Categorías</a>
                <a href="orders.html" class="admin-sidebar__link">🛒 Pedidos</a>
                <a href="users.html" class="admin-sidebar__link">👥 Usuarios</a>
                <a href="promotions.html" class="admin-sidebar__link">🎉 Promociones</a>
            </nav>
            <div class="admin-sidebar__logout">
                <a href="../../html/auth/login.html" class="admin-sidebar__logout-link" data-logout-link>⬅ Cerrar sesión</a>
            </div>
        </aside>

        <!-- Main -->
        <div class="admin-main">
            <div class="admin-topbar">
                <span class="admin-topbar__title">Gestión de Categorías</span>
                <span class="admin-topbar__user">Admin</span>
            </div>

            <div class="admin-content">
                <h1 class="admin-page-title">Categorías</h1>

                <!-- Add category form -->
                <div class="admin-widget admin-widget--form">
                    <div class="admin-widget__header">Nueva Categoría</div>
                    <div class="admin-widget__body">
                        <form action="#" method="post" id="admin-category-form">
                            <div class="admin-form__group">
                                <label for="cat-name" class="admin-form__label">Nombre de la Categoría</label>
                                <input type="text" id="cat-name" name="cat-name" class="admin-form__input" placeholder="Ej: Accesorios" required>
                            </div>
                            <div class="admin-form__group">
                                <label for="cat-description" class="admin-form__label">Descripción</label>
                                <input type="text" id="cat-description" name="cat-description" class="admin-form__input" placeholder="Descripción breve...">
                            </div>
                            <div class="admin-form__actions">
                                <button type="submit" class="admin-btn admin-btn--primary">Agregar Categoría</button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Categories table -->
                <div class="admin-table-wrapper">
                    <div class="admin-action-bar">
                        <div class="admin-search">
                            <input type="text" class="admin-search__input" id="admin-entity-search" placeholder="Buscar categoría...">
                            <button class="admin-search__button" type="button">Buscar</button>
                        </div>
                        <!-- <select class="admin-search__input admin-filter-select" id="admin-entity-filter">
                            <option value="">Todas las categorías</option>
                            <option value="activa">Nombre</option>
                            <option value="inactiva">Fecha</option>
                        </select> -->
                    </div>
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nombre</th>
                                <th>Descripción</th>
                                <th>Productos</th>
                                <th>Fecha</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="admin-entity-body"></tbody>
                    </table>
                </div>
                <div class="admin-pagination" id="admin-entity-pagination"></div>
            </div>
        </div>
    </div>
    <script src="../../js/main.js" type="module"></script>
    <script src="../../js/admin/entity-table.js" type="module"></script>
</body>
</html>
