<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Promociones - DidiStore Admin</title>
    <link rel="stylesheet" href="../../css/main.css">
</head>
<body>
    <div class="admin-layout" data-admin-entity="promotions">
        <!-- Sidebar -->
        <aside class="admin-sidebar">
            <div class="admin-sidebar__logo">DidiStore</div>
            <nav class="admin-sidebar__nav">
                <a href="dashboard.html" class="admin-sidebar__link">🏠 Dashboard</a>
                <a href="products.html" class="admin-sidebar__link">📦 Productos</a>
                <a href="categories.html" class="admin-sidebar__link">🏷️ Categorías</a>
                <a href="orders.html" class="admin-sidebar__link">🛒 Pedidos</a>
                <a href="users.html" class="admin-sidebar__link">👥 Usuarios</a>
                <a href="promotions.html" class="admin-sidebar__link admin-sidebar__link--active">🎉 Promociones</a>
            </nav>
            <div class="admin-sidebar__logout">
                <a href="../../html/auth/login.html" class="admin-sidebar__logout-link" data-logout-link>⬅ Cerrar sesión</a>
            </div>
        </aside>

        <!-- Main -->
        <div class="admin-main">
            <div class="admin-topbar">
                <span class="admin-topbar__title">Gestión de Promociones</span>
                <span class="admin-topbar__user">Admin</span>
            </div>

            <div class="admin-content">
                <h1 class="admin-page-title">Promociones</h1>

                <div class="admin-action-bar">
                    <div class="admin-search">
                        <input type="text" class="admin-search__input" id="admin-entity-search" placeholder="Buscar promoción...">
                        <button class="admin-search__button" type="button">Buscar</button>
                    </div>
                    <select class="admin-search__input admin-filter-select" id="admin-entity-filter">
                        <option value="">Todos los estados</option>
                        <option value="activa">Activa</option>
                        <option value="expirada">Expirada</option>
                    </select>
                    <button class="admin-btn admin-btn--primary">+ Nueva Promoción</button>
                </div>

                <!-- New promotion form -->
                <div class="admin-widget admin-widget--form-wide">
                    <div class="admin-widget__header">Crear Promoción</div>
                    <div class="admin-widget__body">
                        <form action="#" method="post">
                            <div class="admin-form__row">
                                <div class="admin-form__group">
                                    <label for="promo-name" class="admin-form__label">Nombre de la Promoción</label>
                                    <input type="text" id="promo-name" name="promo-name" class="admin-form__input" placeholder="Ej: Descuento de verano" required>
                                </div>
                                <div class="admin-form__group">
                                    <label for="promo-code" class="admin-form__label">Código Promocional</label>
                                    <input type="text" id="promo-code" name="promo-code" class="admin-form__input" placeholder="Ej: VERANO20">
                                </div>
                            </div>
                            <div class="admin-form__row">
                                <div class="admin-form__group">
                                    <label for="promo-discount" class="admin-form__label">Descuento (%)</label>
                                    <input type="number" id="promo-discount" name="promo-discount" class="admin-form__input" placeholder="0" min="1" max="100" required>
                                </div>
                                <div class="admin-form__group">
                                    <label for="promo-type" class="admin-form__label">Tipo</label>
                                    <select id="promo-type" name="promo-type" class="admin-form__select">
                                        <option value="percentage">Porcentaje</option>
                                        <option value="fixed">Valor fijo</option>
                                        <option value="shipping">Envío gratis</option>
                                    </select>
                                </div>
                            </div>
                            <div class="admin-form__row">
                                <div class="admin-form__group">
                                    <label for="promo-start" class="admin-form__label">Fecha Inicio</label>
                                    <input type="date" id="promo-start" name="promo-start" class="admin-form__input" required>
                                </div>
                                <div class="admin-form__group">
                                    <label for="promo-end" class="admin-form__label">Fecha Fin</label>
                                    <input type="date" id="promo-end" name="promo-end" class="admin-form__input" required>
                                </div>
                            </div>
                            <div class="admin-form__actions">
                                <button type="submit" class="admin-btn admin-btn--primary">Crear Promoción</button>
                                <button type="reset" class="admin-btn admin-btn--secondary">Limpiar</button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Promotions table -->
                <div class="admin-table-wrapper">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nombre</th>
                                <th>Código</th>
                                <th>Descuento</th>
                                <th>Tipo</th>
                                <th>Inicio</th>
                                <th>Fin</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="admin-entity-body"></tbody>
                    </table>
                </div>
                <div class="admin-pagination" id="admin-entity-pagination"></div>
            </div>
        </div>
    </div>
    <script src="../../js/main.js" type="module"></script>
    <script src="../../js/admin/entity-table.js" type="module"></script>
</body>
</html>
