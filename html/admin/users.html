<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Usuarios - DidiStore Admin</title>
    <link rel="stylesheet" href="../../css/main.css">
</head>
<body>
    <div class="admin-layout" id="admin-users">
        <!-- Sidebar -->
        <aside class="admin-sidebar">
            <div class="admin-sidebar__logo">DidiStore</div>
            <nav class="admin-sidebar__nav">
                <a href="dashboard.html" class="admin-sidebar__link">🏠 Dashboard</a>
                <a href="products.html" class="admin-sidebar__link">📦 Productos</a>
                <a href="categories.html" class="admin-sidebar__link">🏷️ Categorías</a>
                <a href="orders.html" class="admin-sidebar__link">🛒 Pedidos</a>
                <a href="users.html" class="admin-sidebar__link admin-sidebar__link--active">👥 Usuarios</a>
                <a href="promotions.html" class="admin-sidebar__link">🎉 Promociones</a>
            </nav>
            <div class="admin-sidebar__logout">
                <a href="../../html/auth/login.html" class="admin-sidebar__logout-link" data-logout-link>⬅ Cerrar sesión</a>
            </div>
        </aside>

        <!-- Main -->
        <div class="admin-main">
            <div class="admin-topbar">
                <span class="admin-topbar__title">Gestión de Usuarios</span>
                <span class="admin-topbar__user">Admin</span>
            </div>

            <div class="admin-content">
                <h1 class="admin-page-title">Usuarios</h1>

                <div class="admin-action-bar">
                    <div class="admin-search">
                        <input type="text" class="admin-search__input" id="users-search-input" placeholder="Buscar por nombre, correo o documento...">
                        <button class="admin-search__button" type="button">Buscar</button>
                    </div>
                    <select class="admin-search__input admin-filter-select" id="users-role-filter">
                        <option value="">Todos los roles</option>
                        <option value="admin">Administrador</option>
                        <option value="empl">Empleado</option>
                        <option value="customer">Cliente</option>
                    </select>
                </div>

                <div class="admin-table-wrapper">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>ID Usuario</th>
                                <th>Email</th>
                                <th>Nombre y Apellido</th>
                                <th>Tipo Documento</th>
                                <th>Documento</th>
                                <th>Rol</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="users-table-body"></tbody>
                    </table>
                </div>

                <div class="admin-pagination" id="users-pagination"></div>
            </div>
        </div>
    </div>

    <!-- Script JavaScript -->
    <script src="../../js/main.js" type="module"></script>
    <script src="../../js/admin/users.js" type="module"></script>
</body>
</html>
