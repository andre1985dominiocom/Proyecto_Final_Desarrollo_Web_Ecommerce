<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Usuarios - DidiStore Admin</title>
    <link rel="stylesheet" href="../../css/main.css">
</head>
<body>
    <div class="admin-layout" id="admin-users">
        <!-- Sidebar -->
        <aside class="admin-sidebar">
            <div class="admin-sidebar__logo">DidiStore</div>
            <nav class="admin-sidebar__nav">
                <a href="dashboard.html" class="admin-sidebar__link">🏠 Dashboard</a>
                <a href="products.html" class="admin-sidebar__link">📦 Productos</a>
                <a href="categories.html" class="admin-sidebar__link">🏷️ Categorías</a>
                <a href="orders.html" class="admin-sidebar__link">🛒 Pedidos</a>
                <a href="users.html" class="admin-sidebar__link admin-sidebar__link--active">👥 Usuarios</a>
                <a href="promotions.html" class="admin-sidebar__link">🎉 Promociones</a>
            </nav>
            <div class="admin-sidebar__logout">
                <a href="../../html/auth/login.html" class="admin-sidebar__logout-link">⬅ Cerrar sesión</a>
            </div>
        </aside>

        <!-- Main -->
        <div class="admin-main">
            <div class="admin-topbar">
                <span class="admin-topbar__title">Gestión de Usuarios</span>
                <span class="admin-topbar__user">Admin</span>
            </div>

            <div class="admin-content">
                <h1 class="admin-page-title">Usuarios</h1>

                <div class="admin-action-bar">
                    <div class="admin-search">
                        <input type="text" class="admin-search__input" placeholder="Buscar por nombre o correo...">
                        <button class="admin-search__button">Buscar</button>
                    </div>
                    <select class="admin-search__input admin-filter-select">
                        <option value="">Todos los roles</option>
                        <option value="admin">Administrador</option>
                        <option value="empl">Empleado</option>
                        <option value="customer">Cliente</option>
                    </select>
                </div>

                <div class="admin-table-wrapper">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>ID Usuario</th>
                                <th>Email</th>
                                <th>Nombre</th>
                                <th>Apellido</th>
                                <th>Documento</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="users-table-body">
                            <tr>
                                <td></td>
                                <td><span class="admin-user-avatar"></span></td>
                                <td></td>
                                <td></td>
                                <td></td>
                                <td><span class="admin-badge admin-badge--info"></span></td>
                                <td><span class="admin-badge admin-badge--success"></span></td>
                                <td>
                                    <div class="admin-table__actions">
                                        <button class="admin-btn admin-btn--primary admin-btn--small">Ver</button>
                                        <button class="admin-btn admin-btn--danger admin-btn--small">Desactivar</button>
                                    </div>
                                </td>
                            </tr>
                            <tr>
                                <td></td>
                                <td><span class="admin-user-avatar"></span></td>
                                <td></td>
                                <td></td>
                                <td></td>
                                <td><span class="admin-badge admin-badge--info"></span></td>
                                <td><span class="admin-badge admin-badge--success"></span></td>
                                <td>
                                    <div class="admin-table__actions">
                                        <button class="admin-btn admin-btn--primary admin-btn--small">Ver</button>
                                        <button class="admin-btn admin-btn--danger admin-btn--small">Desactivar</button>
                                    </div>
                                </td>
                            </tr>
                            <tr>
                                <td></td>
                                <td><span class="admin-user-avatar"></span></td>
                                <td></td>
                                <td></td>
                                <td></td>
                                <td><span class="admin-badge admin-badge--info"></span></td>
                                <td><span class="admin-badge admin-badge--warning"></span></td>
                                <td>
                                    <div class="admin-table__actions">
                                        <button class="admin-btn admin-btn--primary admin-btn--small">Ver</button>
                                        <button class="admin-btn admin-btn--secondary admin-btn--small">Activar</button>
                                    </div>
                                </td>
                            </tr>
                            <tr>
                                <td></td>
                                <td><span class="admin-user-avatar"></span></td>
                                <td></td>
                                <td></td>
                                <td></td>
                                <td><span class="admin-badge admin-badge--info"></span></td>
                                <td><span class="admin-badge admin-badge--success"></span></td>
                                <td>
                                    <div class="admin-table__actions">
                                        <button class="admin-btn admin-btn--primary admin-btn--small">Ver</button>
                                        <button class="admin-btn admin-btn--danger admin-btn--small">Desactivar</button>
                                    </div>
                                </td>
                            </tr>
                            <tr>
                                <td></td>
                                <td><span class="admin-user-avatar"></span></td>
                                <td></td>
                                <td></td>
                                <td></td>
                                <td><span class="admin-badge admin-badge--warning"></span></td>
                                <td><span class="admin-badge admin-badge--success"></span></td>
                                <td>
                                    <div class="admin-table__actions">
                                        <button class="admin-btn admin-btn--primary admin-btn--small">Ver</button>
                                        <button class="admin-btn admin-btn--danger admin-btn--small">Desactivar</button>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                    <button class="admin-btn admin-btn--danger admin-btn--small">Desactivar</button>
                </div>

                <div class="admin-pagination">
                    <button class="admin-pagination__btn">‹ Anterior</button>
                    <button class="admin-pagination__btn admin-pagination__btn--active">1</button>
                    <button class="admin-pagination__btn">2</button>
                    <button class="admin-pagination__btn">Siguiente ›</button>
                </div>
            </div>
        </div>
    </div>

    <div class="admin-form-wrapper">
    <h2>Registrar usuario</h2>

    <form id="user-form">
        <input type="hidden" id="idUsuario">

        <div>
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" required>
        </div>

        <div>
            <label for="apellido">Apellido</label>
            <input type="text" id="apellido" required>
        </div>

        <div>
            <label for="email">Correo</label>
            <input type="email" id="email" required>
        </div>

        <div>
            <label for="contrasena">Contraseña</label>
            <input type="password" id="contrasena" required>
        </div>

        <div>
            <label for="documento">Documento</label>
            <input type="text" id="documento" required>
        </div>

        <div>
            <label for="tipoDocumento">Tipo documento</label>
            <select id="tipoDocumento" required>
                <option value="">Seleccione</option>
                <option value="CC">CC</option>
                <option value="TI">TI</option>
                <option value="CE">CE</option>
            </select>
        </div>

        <div>
            <label for="perfilId">Perfil</label>
            <select id="perfilId" required>
                <option value="">Seleccione</option>
                <option value="1">Administrador</option>
                <option value="2">Empleado</option>
                <option value="3">Cliente</option>
            </select>
        </div>

        <div>
            <label for="estado">Estado</label>
            <select id="estado" required>
                <option value="">Seleccione</option>
                <option value="Activo">Activo</option>
                <option value="Inactivo">Inactivo</option>
            </select>
        </div>

        <div>
            <label for="emailVerificado">Email verificado</label>
            <select id="emailVerificado" required>
                <option value="true">Sí</option>
                <option value="false">No</option>
            </select>
        </div>

        <button type="submit">Guardar usuario</button>
    </form>
</div>
    <script src="../../js/admin/users.js" type="module"></script>
</body>
</html>
