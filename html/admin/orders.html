<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Pedidos - DidiStore Admin</title>
    <link rel="stylesheet" href="../../css/main.css">
</head>
<body>
    <div class="admin-layout" data-admin-entity="orders">
        <!-- Sidebar -->
        <aside class="admin-sidebar">
            <div class="admin-sidebar__logo">DidiStore</div>
            <nav class="admin-sidebar__nav">
                <a href="dashboard.html" class="admin-sidebar__link">🏠 Dashboard</a>
                <a href="products.html" class="admin-sidebar__link">📦 Productos</a>
                <a href="categories.html" class="admin-sidebar__link">🏷️ Categorías</a>
                <a href="orders.html" class="admin-sidebar__link admin-sidebar__link--active">🛒 Pedidos</a>
                <a href="users.html" class="admin-sidebar__link">👥 Usuarios</a>
                <a href="promotions.html" class="admin-sidebar__link">🎉 Promociones</a>
            </nav>
            <div class="admin-sidebar__logout">
                <a href="../../html/auth/login.html" class="admin-sidebar__logout-link" data-logout-link>⬅ Cerrar sesión</a>
            </div>
        </aside>

        <!-- Main -->
        <div class="admin-main">
            <div class="admin-topbar">
                <span class="admin-topbar__title">Gestión de Pedidos</span>
                <span class="admin-topbar__user">Admin</span>
            </div>

            <div class="admin-content">
                <h1 class="admin-page-title">Pedidos</h1>

                <div class="admin-action-bar">
                    <div class="admin-search">
                        <input type="text" class="admin-search__input" id="admin-entity-search" placeholder="Buscar por cliente o #pedido...">
                        <button class="admin-search__button" type="button">Buscar</button>
                    </div>
                    <select class="admin-search__input admin-filter-select" id="admin-entity-filter">
                        <option value="">Todos los estados</option>
                        <option value="pending">Pendiente</option>
                        <option value="processing">En proceso</option>
                        <option value="shipped">Enviado</option>
                        <option value="delivered">Entregado</option>
                        <option value="cancelled">Cancelado</option>
                    </select>
                </div>

                <div class="admin-table-wrapper">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>#Pedido</th>
                                <th>Cliente</th>
                                <th>Fecha</th>
                                <th>Productos</th>
                                <th>Total</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="admin-entity-body"></tbody>
                    </table>
                </div>

                <div class="admin-pagination" id="admin-entity-pagination"></div>
            </div>
        </div>
    </div>
    <script src="../../js/main.js" type="module"></script>
    <script src="../../js/admin/entity-table.js" type="module"></script>
</body>
</html>
