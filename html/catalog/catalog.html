<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo - DidiStore</title>
    <link rel="stylesheet" href="../../css/main.css">
</head>
<body>
    <header class="header">
        <div class="header__container container">
            <div class="header__logo">
                <img src="../../assets/logos/Group_3-removebg-preview.png" alt="DidiStore Logo">
                <h2 class="header__title"><a href="../../index.html">DidiStore</a></h2>
            </div>
            <nav class="navigation">
                <ul class="navigation__list">
                    <li class="navigation__item"><a class="navigation__link" href="../../index.html">Inicio</a></li>
                    <li class="navigation__item"><a class="navigation__link" href="category.html">Categorías</a></li>
                    <li class="navigation__item"><a class="navigation__link navigation__link--active" href="catalog.html">Catálogo</a></li>
                    <li class="navigation__item"><a class="navigation__link" href="../promotions/promotions.html">Ofertas</a></li>
                    <li class="navigation__item"><a class="navigation__link" href="../auth/login.html" data-auth-link>Ingresar</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="main">
        <section class="catalog">
            <div class="catalog__container container">
                <div class="catalog__header">
                    <h1 class="catalog__title">Catálogo de Productos</h1>
                    <div class="catalog__controls">
                        <span class="catalog__count">Mostrando <strong id="catalog-count-current">0</strong> de <strong id="catalog-count-total">0</strong> productos</span>
                        <div class="catalog__sort">
                            <label for="sort-select" class="catalog__sort-label">Ordenar por:</label>
                            <select id="sort-select" class="catalog__sort-select">
                                <option value="relevance">Relevancia</option>
                                <option value="price-asc">Precio: menor a mayor</option>
                                <option value="price-desc">Precio: mayor a menor</option>
                                <option value="newest">Más recientes</option>
                                <option value="popular">Más populares</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="catalog__body">
                    <!-- Sidebar de filtros -->
                    <aside class="filters">
                        <h2 class="filters__title">Filtros</h2>

                        <div class="filters__group">
                            <h3 class="filters__group-title">Categorías</h3>
                            <ul class="filters__list" id="filters-category-list">
                            </ul>
                        </div>

                        <div class="filters__group">
                            <h3 class="filters__group-title">Precio</h3>
                            <div class="filters__price">
                                <div class="filters__price-inputs">
                                    <input type="number" class="filters__price-input" id="price-min" placeholder="Mín" min="0">
                                    <span class="filters__price-separator">-</span>
                                    <input type="number" class="filters__price-input" id="price-max" placeholder="Máx" min="0">
                                </div>
                                <button class="filters__price-apply">Aplicar</button>
                            </div>
                        </div>

                        <div class="filters__group">
                            <h3 class="filters__group-title">Valoración</h3>
                            <ul class="filters__list">
                                <li class="filters__item">
                                    <label class="filters__label">
                                        <input type="radio" class="filters__radio" name="rating" value="5"> ★★★★★
                                    </label>
                                </li>
                                <li class="filters__item">
                                    <label class="filters__label">
                                        <input type="radio" class="filters__radio" name="rating" value="4"> ★★★★☆ y más
                                    </label>
                                </li>
                                <li class="filters__item">
                                    <label class="filters__label">
                                        <input type="radio" class="filters__radio" name="rating" value="3"> ★★★☆☆ y más
                                    </label>
                                </li>
                                <li class="filters__item">
                                    <label class="filters__label">
                                        <input type="radio" class="filters__radio" name="rating" value="2"> ★★☆☆☆ y más
                                    </label>
                                </li>
                                <li class="filters__item">
                                    <label class="filters__label">
                                        <input type="radio" class="filters__radio" name="rating" value="1"> ★☆☆☆☆ y más
                                    </label>
                                </li>
                            </ul>
                        </div>

                        <div class="filters__group">
                            <h3 class="filters__group-title">Disponibilidad</h3>
                            <ul class="filters__list">
                                <li class="filters__item">
                                    <label class="filters__label">
                                        <input type="checkbox" class="filters__checkbox" name="availability" value="in-stock"> En stock
                                    </label>
                                </li>
                                <li class="filters__item">
                                    <label class="filters__label">
                                        <input type="checkbox" class="filters__checkbox" name="availability" value="on-sale"> En oferta
                                    </label>
                                </li>
                            </ul>
                        </div>

                        <button class="filters__reset">Limpiar filtros</button>
                    </aside>

                    <!-- Grilla de productos -->
                    <section class="catalog__products">
                        <div class="catalog__grid">

                        </div>

                        <!-- Paginación -->
                        <nav class="catalog__pagination" aria-label="Paginación del catálogo">
                            <button class="catalog__page-btn catalog__page-btn--prev" disabled>&laquo; Anterior</button>
                            <ul class="catalog__pages">
                                <li><a class="catalog__page catalog__page--active" href="#">1</a></li>
                                <li><a class="catalog__page" href="#">2</a></li>
                                <li><a class="catalog__page" href="#">3</a></li>
                                <li><a class="catalog__page" href="#">4</a></li>
                            </ul>
                            <button class="catalog__page-btn catalog__page-btn--next">Siguiente &raquo;</button>
                        </nav>
                    </section>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="footer__container container">
            <p class="footer__text">&copy; 2026 DidiStore. Todos los derechos reservados.</p>
        </div>
    </footer>
    <script src="../../js/main.js" type="module"></script>
    <script src="../../js/catalog/catalog.js" type="module"></script>
</body>
</html>
