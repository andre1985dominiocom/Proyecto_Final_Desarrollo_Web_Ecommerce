<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Restablecer Contraseña</title>

    <!-- Estilos globales -->
    <link rel="stylesheet" href="../../CSS/main.css">

    <!-- Módulo auth -->
    <link rel="stylesheet" href="../../CSS/modules/auth/login.css">
</head>

<body>

    <main class="auth">

        <section class="auth__card">

            <!-- Encabezado -->
            <header class="auth__header">

                <h2 class="auth__title">
                    Restablecer Contraseña
                </h2>

                <p class="auth__subtitle">
                    Ingresa tu nueva contraseña
                </p>

            </header>

            <!-- Formulario -->
            <form class="auth__form" action="#" method="post">

                <!-- Nueva contraseña -->
                <label for="new-password" class="auth__label">
                    Nueva Contraseña
                </label>

                <input
                    type="password"
                    id="new-password"
                    name="new-password"
                    class="auth__input"
                    required
                >

                <!-- Confirmar contraseña -->
                <label for="confirm-password" class="auth__label">
                    Confirmar Contraseña
                </label>

                <input
                    type="password"
                    id="confirm-password"
                    name="confirm-password"
                    class="auth__input"
                    required
                >

                <!-- Botón -->
                <button type="submit" class="auth__button">
                    Guardar Contraseña
                </button>

            </form>

            <hr class="auth__divider">

            <!-- Footer -->
            <footer class="auth__footer">

                <a href="../auth/login.html" class="auth__link">
                    Volver al inicio de sesión
                </a>

            </footer>

        </section>

    </main>

</body>
</html>
