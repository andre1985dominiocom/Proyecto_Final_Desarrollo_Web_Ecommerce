<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login DidiStore</title>

    <!-- Estilos globales -->
    <link rel="stylesheet" href="../../css/main.css">

    <!-- Estilos del módulo -->
    <link rel="stylesheet" href="../../css/modules/auth/login.css">
</head>

<body>

    <main class="auth">

        <section class="auth__card">

            <!-- Encabezado -->
            <header class="auth__header">

                <h2 class="auth__title">
                    Iniciar Sesión
                </h2>

                <p class="auth__subtitle">
                    Accede a tu cuenta de DidiStore
                </p>

            </header>

            <!-- Formulario -->
            <form class="auth__form" id="login-form">

                <label for="username" class="auth__label">
                    Correo electrónico
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    class="auth__input"
                    required
                >

                <label for="password" class="auth__label">
                    Contraseña
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    class="auth__input"
                    required
                >

                <button type="submit" class="auth__button">
                    Ingresar
                </button>

            </form>

            <hr class="auth__divider">

            <!-- Footer -->
            <footer class="auth__footer">

                <p>
                    ¿No tienes una cuenta?
                    <a href="../auth/register.html" class="auth__link">
                        Regístrate aquí
                    </a>
                </p>

                <p>
                    ¿Olvidaste tu contraseña?
                    <a href="../auth/forgot-password.html" class="auth__link">
                        Recupérala aquí
                    </a>
                </p>

            </footer>

        </section>

    </main>
    <script src="../../js/auth/login.js" type="module"></script>
</body>
</html>
