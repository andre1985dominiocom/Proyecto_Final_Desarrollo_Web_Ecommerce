<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recuperar Contraseña</title>

    <link rel="stylesheet" href="../../CSS/main.css">
    <link rel="stylesheet" href="../../CSS/modules/auth/login.css">
</head>

<body>

    <main class="auth">

        <section class="auth__card">

            <header class="auth__header">

                <h2 class="auth__title">
                    Recuperar Contraseña
                </h2>

                <p class="auth__subtitle">
                    Ingresa tu correo electrónico para continuar
                </p>

            </header>

            <form class="auth__form" action="#" method="post">

                <label for="recovery" class="auth__label">
                    Correo Electrónico
                </label>

                <input
                    type="email"
                    id="recovery"
                    name="recovery"
                    class="auth__input"
                    required
                >

                <button type="submit" class="auth__button">
                    Enviar
                </button>

            </form>

            <hr class="auth__divider">

            <footer class="auth__footer">

                <a class="auth__link" href="login.html">
                    Volver al inicio de sesión
                </a>

            </footer>

        </section>

    </main>

</body>
</html>
